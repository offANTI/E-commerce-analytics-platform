name: Deploy Azure Databricks

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "azure_databricks/**"
      - "databricks.yml"
      - "resources/**"
      - ".github/workflows/azure-databricks-deploy.yml"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Validate and Deploy to Databricks
    runs-on: ubuntu-latest

    environment: dev

    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install project dependencies
        working-directory: azure_databricks
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Databricks bundle
        run: |
          databricks bundle validate --target dev

      - name: Deploy Databricks bundle
        run: |
          databricks bundle deploy --target dev

      - name: Deployment summary
        run: |
          echo "Databricks deployment completed successfully."
          echo "Workspace: ${DATABRICKS_HOST}"
          echo "Target: dev"