name: Azure Databricks Data Quality

on:
  push:
    branches:
      - main
    paths:
      - "azure_databricks/**"
      - ".github/workflows/data-quality.yml"

  pull_request:
    branches:
      - main
    paths:
      - "azure_databricks/**"
      - ".github/workflows/data-quality.yml"

jobs:
  data-quality:
    name: PySpark Data Quality Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: Install dependencies
        working-directory: azure_databricks
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install pytest pyspark delta-spark
          fi

      - name: Run unit tests
        run: |
          python -m pytest azure_databricks/tests/unit \
            -v \
            --tb=short

      - name: Run data quality tests
        run: |
          python -m pytest azure_databricks/tests/data_quality \
            -v \
            --tb=short

      - name: Generate JUnit report
        if: always()
        run: |
          mkdir -p test-results

          python -m pytest \
            azure_databricks/tests/unit \
            azure_databricks/tests/data_quality \
            -v \
            --tb=short \
            --junitxml=test-results/pytest.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-databricks-test-results
          path: test-results/
          if-no-files-found: warn